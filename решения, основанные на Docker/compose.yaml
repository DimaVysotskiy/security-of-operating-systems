name: security-labs

services:
  lab01-wrk1:
    build: ./lab01
    hostname: wrk1
    init: true
    cap_add: [NET_ADMIN]
    networks:
      lab01-uplink: {}
      lab01-lan:
        ipv4_address: 192.168.101.11

  lab01-wrk2:
    build: ./lab01
    hostname: wrk2
    init: true
    networks:
      lab01-uplink: {}
      lab01-lan:
        ipv4_address: 192.168.101.12

  lab02:
    build: ./lab02
    hostname: wrk1
    init: true

  lab02-wrk2:
    build:
      context: ./lab02
      target: base
    hostname: wrk2
    init: true

  lab03:
    build: ./lab03
    hostname: wrk1
    init: true

  lab04:
    build: ./lab04
    hostname: wrk1
    init: true

  lab05:
    build: ./lab05
    hostname: wrk1
    init: true

  lab06:
    build: ./lab06
    hostname: wrk1
    init: true

networks:
  lab01-uplink:
    driver: bridge
  lab01-lan:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.101.0/24
