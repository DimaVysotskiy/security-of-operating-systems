name: security-labs

services:
  lab01:
    build: &lab01-build
      context: ./lab01
      args:
        ALT_APT_MIRROR: ${ALT_APT_MIRROR:-}
    hostname: wrk1
    init: true
    cap_add: [NET_ADMIN]
    networks:
      lab01-uplink: {}
      lab01-lan:
        ipv4_address: 192.168.101.11

  lab01-wrk2:
    profiles: [lab01-peer]
    build: *lab01-build
    hostname: wrk2
    init: true
    networks:
      lab01-uplink: {}
      lab01-lan:
        ipv4_address: 192.168.101.12

  lab02:
    build:
      context: ./lab02
      args:
        ALT_APT_MIRROR: ${ALT_APT_MIRROR:-}
    hostname: wrk1
    init: true

  lab02-wrk2:
    profiles: [wrk2]
    build:
      context: ./lab02
      target: base
      args:
        ALT_APT_MIRROR: ${ALT_APT_MIRROR:-}
    hostname: wrk2
    init: true

  lab03:
    build:
      context: ./lab03
      args:
        ALT_APT_MIRROR: ${ALT_APT_MIRROR:-}
    hostname: wrk1
    init: true

  lab04:
    build: ./lab04
    hostname: wrk1
    init: true

  lab05:
    build:
      context: ./lab05
      args:
        ALT_APT_MIRROR: ${ALT_APT_MIRROR:-}
    hostname: wrk1
    init: true

  lab06:
    build:
      context: ./lab06
      args:
        ALT_APT_MIRROR: ${ALT_APT_MIRROR:-}
    hostname: wrk1
    init: true

networks:
  lab01-uplink:
    driver: bridge
  lab01-lan:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.101.0/24
